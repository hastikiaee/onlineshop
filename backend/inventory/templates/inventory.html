<!DOCTYPE html>
<html lang="fa">

<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<meta charset="UTF-8">
<title>Products</title>


<style>
body{
font-family: Arial;
background:#f5f5f5;
margin:0;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.product-card{
background:white;
border-radius:10px;
padding:15px;
cursor:pointer;
transition:.2s;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.product-card:hover{
transform:translateY(-4px);
}

.product-image{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}

.product-title{
font-size:16px;
margin-top:10px;
}

.product-price{
color:#2c7a2c;
margin-top:5px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>Products</h1>

<div id="products-list" class="products">

<!--
محصولات با jQuery اینجا اضافه می‌شوند

ساختار هر محصول:

<div class="product-card" data-id="1">
<img src="image.jpg" class="product-image">
<div class="product-title">Product Name</div>
<div class="product-price">$120</div>
</div>

-->

</div>

</div>

</body>

<script>
      function getProductListUrl(){
        return 'http://localhost:8000/inventory/api/v1/products/';
      }

      function loadProducts(){
        $.ajax({
          url:getProductListUrl(),
          method:'GET',
          success:function(data){

            $('#products-list').empty();

            $.each(data,function(index,product){
              $('#products-list').append(
                `<div class="product-card" data-id="${product.id}">
                 <div class="product-title">${product.name}</div>
                 </div>`
              );
            });

          },
          error:function(xhr){
            console.log(xhr.responseText);
          }
        });
      }
      $(document).ready(function(){
      loadProducts();
      });
      $(document).on('click','.product-card',function(){
        const productId = $(this).data('id');
        window.location.href = `/inventory/inventory/detail/${productId}/`;

      })
          
</script>
</html>
