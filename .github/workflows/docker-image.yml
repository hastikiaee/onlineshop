name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # این مرحله برای بالا آوردن سرویس ها با docker compose است
    - name: Start services
      run: docker compose up -d

    # اجرای تست ها
    - name: Run Tests
      # نام سرویس 'backend' فرض شده است. اگر فرق دارد، اصلاح کنید.
      run: docker compose exec web sh -c 'pytest'

    # این مرحله بعد از تست ها برای پاکسازی اضافه شده است
    - name: Stop services
      if: always() # این مرحله همیشه اجرا می شود، حتی اگر تست ها Fail شوند
      run: docker compose down
