name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # اضافه کردن مرحله برای نمایش مسیر فعلی و فایل ها جهت اطمینان
    - name: Debug - Show current directory and files
      run: |
        pwd
        ls -la
        # اگر فایل docker-compose.yml در روت پروژه نیست، مسیر صحیح آن را اینجا مشخص کنید
        # مثلاً اگر در پوشه 'infra' است: ls -la infra/
        # و سپس در دستورات بعدی از آن مسیر استفاده کنید.

    - name: Create .env file
      run: |
        touch .env
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
        echo "DEBUG=True" >> .env
        # متغیرهای دیگر خود را اینجا اضافه کنید

    # بالا آوردن سرویس ها با داکر کامپوز
    # این دستور باید قبل از اجرای تست ها اجرا شود
    - name: Start services with Docker Compose
      run: docker compose up -d

    # اجرای تست ها - این مرحله باید بلافاصله بعد از بالا آمدن سرویس ها اجرا شود
    - name: Run Tests
      # فرض می کنیم نام سرویس backend است و در مسیر روت قرار دارد
      run: docker compose exec web pytest

    # پاکسازی - این مرحله همیشه اجرا می شود
    - name: Stop services
      if: always()
      run: docker compose down
