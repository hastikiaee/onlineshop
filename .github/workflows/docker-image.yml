name: Docker Compose Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4



    - name: Run Docker Compose up
      run: docker compose up -d # سرویس ها را در پس زمینه اجرا می کند

    - name: Run Tests with Docker Compose
      run: docker compose --profile test up -d db web
    # پاکسازی پس از اتمام تست ها (مهم برای جلوگیری از مصرف منابع)
    - name: Stop Docker Compose services
      if: always() # این دستور حتی اگر تست ها با خطا مواجه شوند هم اجرا می شود
      run: docker compose down
