name: Docker Compose Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Set up Environment Variables
      run: |
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
        echo "POSTGRES_HOST=db" >> .env # حتماً هاست را برای د

    - name: Run Docker Compose up
      run: docker compose up -d # سرویس ها را در پس زمینه اجرا می کند

    - name: Run Tests with Docker Compose
      run: docker compose run --rm web pytest # فرض می کنیم سرویس شما 'web' نام دارد

    # پاکسازی پس از اتمام تست ها (مهم برای جلوگیری از مصرف منابع)
    - name: Stop Docker Compose services
      if: always() # این دستور حتی اگر تست ها با خطا مواجه شوند هم اجرا می شود
      run: docker compose down
